
<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mani ceļojumi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <a href="index.html">Sākums</a>
    <a href="index.html#par-mani">Par mani</a>
    <a href="celojumi.html">Ceļojumi</a>
</nav>

<h1>Mani ceļojumi</h1>

<section>
    <h2>Ceļojums uz Taizemi</h2>
    <p>Šeit es publicēšu savas ceļojumu fotogrāfijas un aprakstus.</p>
    <img src="foto1-mazs.jpg" alt="Ceļojuma fotogrāfija Taizemē" class="mana-foto">
</section>


<section>
    <h2>Singapūra-2025</h2>
    <p>Fotogrāfijas no mana ceļojuma uz Singapūru.</p>

    <div class="galerija">
        <figure>
            <img src="images/singapura-2025/1.jpg" alt="Singapūra 2025">
            <figcaption>Singapūra – 1</figcaption>
        </figure>

        <figure>
            <img src="images/singapura-2025/2.jpg" alt="Singapūra 2025">
            <figcaption>Singapūra – 2</figcaption>
        </figure>

        <figure>
            <img src="images/singapura-2025/3.jpg" alt="Singapūra 2025">
            <figcaption>Singapūra – 3</figcaption>
        </figure>

        <figure>
            <img src="images/singapura-2025/4.jpg" alt="Singapūra 2025">
            <figcaption>Singapūra – 4</figcaption>
        </figure>
    </div>
</section>

<!-- Fotogrāfijas palielināšanas logs -->
<dialog id="foto-logs">
    <button id="foto-aizvert" aria-label="Aizvērt">×</button>
    <img id="lielais-foto" alt="Palielināta fotogrāfija">
</dialog>

<script>
const logs = document.getElementById("foto-logs");
const lielais = document.getElementById("lielais-foto");

document.querySelectorAll(".galerija img").forEach(foto => {
    foto.addEventListener("click", () => {
        lielais.src = foto.src;
        lielais.alt = foto.alt;
        logs.showModal();
    });
});

document.getElementById("foto-aizvert").addEventListener("click", () => {
    logs.close();
});

logs.addEventListener("click", (event) => {
    if (event.target === logs) logs.close();
});
</script>


</body>
</html>
